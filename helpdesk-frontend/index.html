<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mesa de Ayuda - IESTP Ramón Copaja</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div>
        <h3 class="mb-0">Mesa de Ayuda</h3>
        <small class="text-muted">IESTP "Ramón Copaja" – APSTI (Registrar y Ver Tickets)</small>
      </div>
      <a href="login.html" class="btn btn-outline-primary btn-sm">Iniciar sesión / Token JWT</a>
    </div>

    <!-- Contenedor de mensajes de estado -->
    <div id="msg" class="alert d-none mt-3" role="alert"></div>

    <!-- Formulario para registrar ticket -->
    <div class="card shadow-sm mt-3">
      <div class="card-header fw-semibold">Registrar Ticket</div>
      <div class="card-body">
        <form id="frm" class="row g-3">
          <div class="col-md-6">
            <label for="titulo" class="form-label">Titulo</label>
            <input id="titulo" class="form-control" required minlength="5"
                   placeholder="Ej: Sin internet en laboratorio">
          </div>

          <div class="col-md-3">
            <label for="categoria" class="form-label">Categoria</label>
            <input id="categoria" class="form-control" value="General">
          </div>

          <div class="col-md-3">
            <label for="prioridad" class="form-label">Prioridad</label>
            <select id="prioridad" class="form-select">
              <option>Baja</option>
              <option selected>Media</option>
              <option>Alta</option>
              <option>Critica</option>
            </select>
          </div>

          <div class="col-12">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea id="descripcion" class="form-control" rows="2"
                      placeholder="Describe el incidente o requerimiento"></textarea>
          </div>

          <div class="col-12">
            <button type="submit" class="btn btn-success">Registrar</button>
            <button id="btnCargar" type="button" class="btn btn-outline-secondary">
              Cargar tickets
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Tabla de tickets -->
    <div class="card shadow-sm mt-3">
      <div class="card-header fw-semibold">Tickets (desde la BD)</div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Titulo</th>
                <th>Categoria</th>
                <th>Prioridad</th>
                <th>Estado</th>
                <th>Creado</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <small class="text-muted">
          Si reinicias el backend, los tickets deben seguir apareciendo (porque están en MySQL).
        </small>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
