<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Login Mesa de Ayuda - IESTP Ramón Copaja</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4" style="max-width: 900px;">
    <h3 class="mb-0">Mesa de Ayuda</h3>
    <small class="text-muted">Semana 11 – Login + Token JWT (IESTP "Ramón Copaja")</small>

    <div id="msg" class="alert d-none mt-3"></div>

    <div class="row g-3 mt-1">
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-header fw-semibold">Iniciar sesión</div>
          <div class="card-body">
            <form id="frm">
              <label class="form-label">Correo</label>
              <input id="correo" class="form-control" value="tecnico1@iestp.local" required>

              <label class="form-label mt-2">Password</label>
              <input id="password" class="form-control" value="tec123" type="password" required>

              <button class="btn btn-success mt-3 w-100">Ingresar</button>
              <button id="btnLogout" type="button" class="btn btn-outline-danger mt-2 w-100">Cerrar sesión</button>
            </form>

            <small class="text-muted d-block mt-3">Token:</small>
            <code id="token" class="d-block text-break bg-light border rounded p-2">-</code>
          </div>
        </div>
      </div>

      <div class="col-md-7">
        <div class="card shadow-sm">
          <div class="card-header fw-semibold">Probar API con token</div>
          <div class="card-body">
            <button id="btnTickets" class="btn btn-primary">GET /api/tickets</button>
            <pre id="out" class="mt-3 bg-light border rounded p-3" style="min-height: 260px;">-</pre>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const BASE_URL = "https://mesa-ayuda-iestp-api.onrender.com";
    const TOKEN_KEY = "helpdesk_token";

    const msg = document.getElementById("msg");
    const out = document.getElementById("out");
    const tokenBox = document.getElementById("token");

    function showMsg(ok, text) {
      msg.classList.remove("d-none", "alert-success", "alert-danger");
      msg.classList.add(ok ? "alert-success" : "alert-danger");
      msg.textContent = text;
    }

    function setToken(t) {
      localStorage.setItem(TOKEN_KEY, t);
      tokenBox.textContent = t;
    }

    function getToken() {
      return localStorage.getItem(TOKEN_KEY);
    }

    function clearToken() {
      localStorage.removeItem(TOKEN_KEY);
      tokenBox.textContent = "-";
    }

    tokenBox.textContent = getToken() || "-";

    document.getElementById("frm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        correo: document.getElementById("correo").value.trim(),
        password: document.getElementById("password").value
      };

      const res = await fetch(`${BASE_URL}/api/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showMsg(false, data.error || `Login falló (${res.status})`);
        return;
      }

      setToken(data.token);
      showMsg(true, "TOKEN guardado en localStorage.");
    });

    document.getElementById("btnLogout").addEventListener("click", () => {
      clearToken();
      showMsg(true, "Sesión cerrada (token eliminado).");
      out.textContent = "-";
    });

    document.getElementById("btnTickets").addEventListener("click", async () => {
      const token = getToken();
      if (!token) {
        showMsg(false, "No hay token. Inicia sesión.");
        return;
      }

      const res = await fetch(`${BASE_URL}/api/tickets`, {
        headers: { "Authorization": `Bearer ${token}` }
      });

      const data = await res.json().catch(() => ({}));
      out.textContent = JSON.stringify({ status: res.status, data }, null, 2);

      if (res.status === 401) showMsg(false, "401: Token faltante/incorrecto/expirado.");
      else if (res.status === 403) showMsg(false, "403: Rol sin permiso.");
      else if (!res.ok) showMsg(false, `Error: ${res.status}`);
      else showMsg(true, "Petición OK con token.");
    });
  </script>
</body>
</html>
